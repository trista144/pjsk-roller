<!doctype html>
<html><head><meta charset="utf-8"><title>compare</title>
<style>body{font:13px/1.6 system-ui;background:#0f172a;color:#e2e8f0;padding:16px}
pre{white-space:pre-wrap;background:#1e293b;padding:12px;border-radius:10px}</style>
</head>
<body><pre id="out">comparing local vs GitHub Pages…</pre>
<script>
const out = (m) => { document.getElementById('out').textContent += '\n' + m; };
const URL_ = 'https://storage.sekai.best/sekai-jp-assets/music/short/0047_01/0047_01_short.mp3';
function testAudio(cross) {
  return new Promise((resolve) => {
    const a = new Audio();
    if (cross) a.crossOrigin = 'anonymous';
    const t0 = performance.now();
    let done = false;
    const finish = (m) => { if (done) return; done = true; out((cross ? 'crossOrigin=anonymous ' : 'no crossOrigin      ') + '→ ' + m + ' (' + Math.round(performance.now() - t0) + 'ms)'); resolve(); };
    a.addEventListener('loadedmetadata', () => finish('loaded duration=' + a.duration.toFixed(1)));
    a.addEventListener('error', () => finish('ERROR code=' + (a.error && a.error.code) + ' ' + (a.error && a.error.message)));
    setTimeout(() => finish('TIMEOUT networkState=' + a.networkState + ' readyState=' + a.readyState), 12000);
    a.src = URL_;
    a.load();
  });
}
(async () => {
  out('origin: ' + location.origin);
  for (let i = 0; i < 2; i += 1) {
    await testAudio(true);
    await testAudio(false);
  }
  out('DONE');
})();
</script>
</body></html>
