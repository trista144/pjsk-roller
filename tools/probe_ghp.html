<!doctype html>
<html><head><meta charset="utf-8"><title>probe from github pages</title>
<style>body{font:13px/1.6 system-ui;background:#0f172a;color:#e2e8f0;padding:16px}
pre{white-space:pre-wrap;background:#1e293b;padding:12px;border-radius:10px}</style>
</head>
<body><pre id="out">probing from …</pre>
<script>
const out = (m) => { document.getElementById('out').textContent += '\n' + m; };
out('origin: ' + location.origin);
const BASE = 'https://storage.sekai.best/sekai-jp-assets/music/short/';
const IDS = ['0001_01', '0047_01', '0019_02', 'se_0601_01'];
(async () => {
  for (const id of IDS) {
    const url = BASE + id + '/' + id + '_short.mp3';
    try {
      const r = await fetch(url, { method: 'GET', headers: { Range: 'bytes=0-1' } });
      out('fetch ' + id + ' -> ' + r.status + ' ' + r.headers.get('content-type') + ' acao=' + (r.headers.get('access-control-allow-origin') || 'none'));
    } catch (e) {
      out('fetch ' + id + ' -> ERR ' + e.message);
    }
  }
  for (const cross of [true, false]) {
    await new Promise((resolve) => {
      const a = new Audio();
      if (cross) a.crossOrigin = 'anonymous';
      const t0 = performance.now();
      let done = false;
      const finish = (m) => { if (done) return; done = true; out('audio ' + (cross ? 'cross ' : 'plain ') + BASE.split('/').slice(-2, -1)[0] + ' 0001_01 ' + m + ' (' + Math.round(performance.now() - t0) + 'ms)'); resolve(); };
      a.addEventListener('loadedmetadata', () => finish('loaded ' + a.duration.toFixed(1) + 's'));
      a.addEventListener('error', () => finish('ERROR code=' + (a.error && a.error.code)));
      setTimeout(() => finish('TIMEOUT rs=' + a.readyState + ' ns=' + a.networkState), 12000);
      a.src = BASE + '0001_01/0001_01_short.mp3';
      a.load();
    });
  }
  out('DONE');
})();
</script>
</body></html>
